[package]
name = "fin"
version = "0.1.0"
edition = "2024"
description = "A minimal native Mermaid workspace"
license = "WTFPL"
rust-version = "1.92"
default-run = "fin"

[features]
default = ["desktop", "tui"]
desktop = ["dep:slint", "dep:rfd", "dep:slint-build"]
tui = ["dep:ratatui", "dep:crossterm", "dep:ratatui-textarea", "dep:unicode-width", "dep:clap", "dep:clap_complete"]

[[bin]]
name = "fin"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "fin-tui"
path = "src/bin/fin-tui.rs"
required-features = ["tui"]

[dependencies]
slint = { version = "=1.18.1", optional = true, default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-18", "accessibility"] }
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
resvg = "0.45"
rfd = { version = "0.17", optional = true }
tempfile = "3"
ratatui = { version = "=0.30.2", optional = true, default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", optional = true }
ratatui-textarea = { version = "=0.9.3", optional = true }
unicode-width = { version = "0.2", optional = true }
clap = { version = "4.5", optional = true, features = ["derive"] }
clap_complete = { version = "4.5", optional = true }

[build-dependencies]
slint-build = { version = "=1.18.1", optional = true }

[dev-dependencies]
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }

[profile.release]
lto = "thin"
strip = true
